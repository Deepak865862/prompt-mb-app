name: prompt_mb
description: "Premium AI Prompt Gallery App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8

  # Firebase (Optional - comment out if not using)
  # firebase_core: ^2.24.2
  # cloud_firestore: ^4.14.0
  # firebase_auth: ^4.16.0

  # Image Handling & Network
  cached_network_image: ^3.4.1
  flutter_image_compress: ^2.1.0

  # HTTP & API
  http: ^1.1.0

  # Navigation & UI
  flutter_staggered_grid_view: ^0.7.0

  # URL Launcher
  url_launcher: ^6.3.1

  # Utilities
  shared_preferences: ^2.2.2
  provider: ^6.1.5+1
  google_mobile_ads: ^5.3.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

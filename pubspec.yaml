name: prompt_mb
description: "Premium AI Prompt Gallery App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # Firebase (Data, Login, Profile)
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  
  # Image Compression (1MB ke andar karne ke liye)
  flutter_image_compress: ^2.1.0
  image_picker: ^1.1.2
  
  # UI & Network
  cached_network_image: ^3.4.1
  flutter_staggered_grid_view: ^0.7.0
  shared_preferences: ^2.2.2
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

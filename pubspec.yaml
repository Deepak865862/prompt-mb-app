name: prompt_mb
description: Prompt MB - Your ultimate source for premium AI prompts
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Design
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_staggered_grid_view: ^0.7.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  
  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0
  firebase_analytics: ^10.8.0
  
  # State Management
  provider: ^6.1.1
  get: ^4.6.6
  
  # API & HTTP
  http: ^1.2.0
  dio: ^5.4.0
  
  # Image Handling
  image_picker: ^1.0.7
  image_cropper: ^5.0.1
  image_compressor: ^2.0.0
  photo_view: ^0.14.0
  
  # Utilities
  url_launcher: ^6.2.4
  clipboard: ^0.1.3
  share_plus: ^7.2.1
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  
  # Ads
  google_mobile_ads: ^4.0.0
  
  # In-App Purchases
  in_app_purchase: ^3.1.13
  
  # Date & Time
  intl: ^0.19.0
  
  # Animations
  animate_do: ^3.3.4
  lottie: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
  
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic

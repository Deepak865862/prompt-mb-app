workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 90
    environment:
      vars:
        FLUTTER_VERSION: "3.24.5"
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches
    scripts:
      - name: Install Flutter 3.24.5
        script: |
          cd $HOME
          rm -rf flutter
          git clone https://github.com/flutter/flutter.git -b 3.24.5 --depth 1
          export PATH="$HOME/flutter/bin:$PATH"
          flutter doctor
      - name: Get Flutter packages
        script: |
          export PATH="$HOME/flutter/bin:$PATH"
          cd $CM_BUILD_DIR
          flutter pub get
      - name: Build APK
        script: |
          export PATH="$HOME/flutter/bin:$PATH"
          cd $CM_BUILD_DIR
          flutter build apk --debug --android-skip-build-dependency-validation
    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/*.aab
